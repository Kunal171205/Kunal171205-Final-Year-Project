<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Set Password</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:Inter, sans-serif;
    background:linear-gradient(135deg,#0a438b,#1e293b);
}
.card{
    background:#fff;
    padding:30px 35px;
    border-radius:12px;
    width:360px;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
}
h2{
    margin-bottom:10px;
    color:#0a438b;
}
p{
    color:#555;
    font-size:14px;
    margin-bottom:20px;
}
input{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:8px;
    margin-bottom:15px;
    font-size:14px;
}
button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#0a438b;
    color:white;
    font-weight:600;
    cursor:pointer;
}
button:hover{
    background:#08336a;
}
</style>
</head>
<body>
<div class="card">
    <h2>Create Password</h2>
    <p>Set a password to secure your account.</p>
    <form method="POST">
        <input type="password" name="password" placeholder="New Password" required>
        <button type="submit">Save Password</button>
    </form>
</div>
</body>
</html>
